name: Build and Upload Coucou

on:
  push:
    branches: [main, fix-antigravity-notch-approvals]
  workflow_dispatch:

jobs:
  build-macos:
    name: Build Coucou macOS App
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: cd NotchBuddy && xcodegen

      - name: Run Antigravity Permission Tests
        run: bash scripts/test-agy-permissions.sh

      - name: Build Release (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project NotchBuddy/NotchBuddy.xcodeproj \
            -scheme NotchBuddy \
            -configuration Release \
            -derivedDataPath ./DerivedData \
            build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Compress App
        run: |
          APP_PATH=$(find ./DerivedData -name "Coucou.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -name "Coucou.app" -type d | head -n 1)
          fi
          echo "Found app at: $APP_PATH"
          APP_DIR=$(dirname "$APP_PATH")
          mkdir -p ./dist
          (cd "$APP_DIR" && zip -r -y "$GITHUB_WORKSPACE/dist/Coucou.zip" Coucou.app)

      - name: Upload Coucou.app Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Coucou-macOS
          path: dist/Coucou.zip
          retention-days: 14
